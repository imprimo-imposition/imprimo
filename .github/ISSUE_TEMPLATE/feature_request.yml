name: "Nápad / Feature request"
description: "Čo by Imprimo malo vedieť? / What should Imprimo be able to do?"
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: "Čo potrebuješ urobiť? / What do you need to do?"
      description: "Opíš zákazku, nie riešenie – napr. „časopis 64 strán, šitý drôtom, z dvoch zložiek“. / Describe the job, not the solution."
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: "Ako to robíš dnes? / How do you do it today?"
